services:
  mongodb:
    image: mongo:7
    container_name: opm-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: taskdb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - opm-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    container_name: opm-backend
    restart: unless-stopped
    environment:
      PORT: 3000
      MONGODB_URI: mongodb://mongodb:27017/taskdb
      JWT_SECRET: ${JWT_SECRET:-085ba2f0c8e3cbdf1ad0f49c5fe9863ed1f72137771c5b2dda92ca5feeac88c5}
      CLIENT_URL: http://localhost:8080
      NODE_ENV: production
    ports:
      - "3000:3000"
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - opm-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: production
      args:
        VITE_API_URL: http://localhost:3000/api
    container_name: opm-frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - backend
    networks:
      - opm-network

volumes:
  mongodb_data:
    driver: local

networks:
  opm-network:
    driver: bridge